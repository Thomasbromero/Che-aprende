<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laboratorio de formatos</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    /* Solo para esta página de pruebas */
    .lab-tabs { flex-wrap: wrap; }
    .lab-tabs .filter-tab { flex: 1 1 30%; }
    .lab-meta { margin: 4px 0 12px; word-break: break-word; }
    .lab-pick { display: flex; gap: 8px; margin: 14px 0 4px; }
    .lab-pick .text-input { flex: 1; }
    .lab-cover { margin-top: 28px; font-size: 0.9rem; }
    .lab-cover td { padding: 3px 12px 3px 0; }
  </style>
</head>
<body>
  <main class="app-main">
    <h2>Laboratorio de formatos</h2>
    <p class="muted small">Herramienta de desarrollo (no es parte de la app). Elegí un formato, probalo y usá "Otro ejercicio". Las respuestas no suman a la racha ni al progreso.</p>

    <div class="filter-tabs lab-tabs" id="tabs"></div>
    <div class="lab-pick">
      <input class="text-input" id="palabra" list="ids" placeholder="Probar con un id, ej: cuadra o v-tener" autocomplete="off" />
      <button class="btn ghost" id="probar">Probar</button>
    </div>
    <datalist id="ids"></datalist>
    <div class="muted small lab-meta" id="meta"></div>
    <div id="lab"></div>

    <table class="lab-cover" id="cover"></table>
  </main>

  <script src="../data/vocab.data.js"></script>
  <script src="../data/verbos.data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/util.js"></script>
  <script>
    // La página de pruebas no toca la racha ni el progreso de la app
    const Streak = { recordActivity() {} };
    function updateHeaderStreak() {}
  </script>
  <script src="../js/exercise.js"></script>
  <script src="../js/conjugador.js"></script>
  <script src="../js/formats.js"></script>
  <script>
    let formato = Formats.lista()[0].id;

    // Los formatos de conjugar usan verbos; los demás, palabras del vocabulario
    function banco(id) {
      return Formats.lista().find((f) => f.id === id).fuente === "verbo" ? VERBOS : VOCAB;
    }
    function aplicables(id) {
      return banco(id).filter((c) => Formats.formatosPara(c).indexOf(id) >= 0);
    }

    function mostrar(c) {
      const lab = document.getElementById("lab");
      clear(lab);
      const ex = Formats.generar(formato, c);
      document.getElementById("meta").textContent = ex
        ? "formato: " + formato + " · " + (c.inf ? "verbo: " + c.id + " · " + ex.tiempo + " / " + ex.persona + (ex.estricto ? " · estricto (la tilde cuenta)" : "") : "palabra: " + c.id + " · tema: " + c.tema)
        : "«" + c.id + "» no tiene el formato " + formato;
      if (!ex) return;
      // Oculto con style (no con la clase "hidden"): ".btn.wide" le gana en especificidad y lo mostraría igual.
      const otro = h("button", { class: "btn primary wide", style: "display:none", onClick: () => nuevo() }, "Otro ejercicio");
      Exercise.mount(lab, ex, {
        placeholder: "Escribí la respuesta",
        checkLabel: "Corregir",
        revealLabel: "Ver respuesta",
        onAnswer: () => (otro.style.display = ""),
      });
      lab.appendChild(otro);
    }

    function nuevo() {
      const c = aplicables(formato);
      mostrar(c[Math.floor(Math.random() * c.length)]);
    }

    function dibujarTabs() {
      const tabs = document.getElementById("tabs");
      clear(tabs);
      Formats.lista().forEach((f) => {
        tabs.appendChild(h("button", { class: "filter-tab" + (f.id === formato ? " active" : ""), onClick: () => { formato = f.id; dibujarTabs(); nuevo(); } }, f.nombre));
      });
    }

    document.getElementById("probar").addEventListener("click", () => {
      const id = document.getElementById("palabra").value.trim();
      const c = banco(formato).find((v) => v.id === id);
      if (c) mostrar(c); else document.getElementById("meta").textContent = "No existe «" + id + "» para este formato.";
    });
    const dl = document.getElementById("ids");
    VOCAB.concat(VERBOS).forEach((c) => dl.appendChild(h("option", { value: c.id })));

    const cover = document.getElementById("cover");
    cover.appendChild(h("caption", { class: "muted small" }, "Cuántas palabras o verbos tienen cada formato"));
    Formats.lista().forEach((f) => cover.appendChild(h("tr", {}, [h("td", {}, f.nombre), h("td", {}, aplicables(f.id).length + " / " + banco(f.id).length)])));

    dibujarTabs();
    nuevo();
  </script>
</body>
</html>
