<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Vista de fondos del mapa</title>
<style>
  body { margin: 0; background: #fff4d6; font: 12px Arial, sans-serif; color: #1d2a44; }
  #grilla { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; align-items: flex-start; }
  .z { position: relative; }
  .z b { position: absolute; left: 4px; top: 2px; z-index: 5; background: rgba(255,255,255,.8); padding: 0 4px; border-radius: 4px; }
  .z svg.fondo, .z img { display: block; }
  .z svg.guia { position: absolute; left: 0; top: 0; }
</style></head>
<body><div id="grilla"></div>
<script src="../../data/camino.data.js"></script><script src="../../data/mapa.data.js"></script><script src="../../js/mapa.js"></script>
<script>
  // ?z=1-6 (o 1,5,9)  &s=0.45 (escala)  &guia=1 (muestra el camino y los niveles encima)
  const q = new URLSearchParams(location.search);
  const zs = (q.get("z") || "1-6").split(",").flatMap((t) => { const m = t.match(/^(\d+)-(\d+)$/); return m ? Array.from({ length: m[2] - m[1] + 1 }, (_, i) => +m[1] + i) : [+t]; });
  const esc = parseFloat(q.get("s") || "0.45"), guia = q.get("guia") === "1";
  const g = Mapa.calcular(CAMINO.niveles.length, MAPA);
  const grilla = document.getElementById("grilla");
  zs.forEach((n) => {
    const z = g.zonas[n - 1]; const H = Math.round(z.bottom - z.top);
    const d = document.createElement("div"); d.className = "z"; d.style.width = 400 * esc + "px";
    d.innerHTML = `<b>${n} · ${MAPA.zonas[n - 1].nombre}</b><img width="${400 * esc}" height="${H * esc}" src="../../assets/mapa/zona-${String(n).padStart(2, "0")}.svg?t=${Date.now()}">`;
    if (guia) {
      const pts = g.puntos.slice(z.primero, z.primero + z.niveles).map((p, i) => `<circle cx="${p.x}" cy="${p.y - z.top}" r="28" fill="#1d2a44" fill-opacity=".88"/><text x="${p.x}" y="${p.y - z.top + 6}" text-anchor="middle" font-size="18" font-weight="700" fill="#fff4d6">${z.primero + i + 1}</text>`).join("");
      const trazo = Mapa.trazo(g.puntos.slice(Math.max(0, z.primero - 1), z.primero + z.niveles + 1).map((p) => ({ x: p.x, y: p.y - z.top })));
      d.insertAdjacentHTML("beforeend", `<svg class="guia" width="${400 * esc}" height="${H * esc}" viewBox="0 0 400 ${H}"><path d="${trazo}" fill="none" stroke="#d4cdce" stroke-width="12" stroke-linecap="round"/>${pts}<rect x="100" y="${z.cartelY - z.top - 28}" width="200" height="56" rx="28" fill="#1d2a44" fill-opacity=".85"/></svg>`);
    }
    grilla.appendChild(d);
  });
</script></body></html>
