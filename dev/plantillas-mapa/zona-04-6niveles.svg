<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2496" viewBox="0 0 400 832">
  <title>Plantilla zona 4: niveles 19 a 24 (400 x 832 unidades = 1200 x 2496 px)</title>
  <rect width="400" height="832" fill="#fff4d6"/>
  <!-- bordes: el de arriba se pega con la zona de arriba (zona 5) y el de abajo con la de abajo (zona 3) -->
  <rect width="400" height="832" fill="none" stroke="#1fb6b5" stroke-width="4"/>
  <!-- franjas de los costados: ahí va el detalle; el camino y los niveles se mueven en el centro -->
  <rect x="0" y="0" width="60" height="832" fill="#1fb6b5" fill-opacity="0.10"/>
  <rect x="340" y="0" width="60" height="832" fill="#1fb6b5" fill-opacity="0.10"/>
  <!-- camino (así lo dibuja la app) -->
  <path d="M290.2 900.0 C292.1 858.0 307.9 709.3 301.4 648.0 C294.9 586.7 273.0 570.7 251.1 532.0 C229.1 493.3 193.8 454.7 169.8 416.0 C145.7 377.3 118.4 338.7 106.8 300.0 C95.2 261.3 92.4 222.7 100.4 184.0 C108.3 145.3 131.8 129.3 154.4 68.0 C177.0 6.7 222.4 -142.0 236.0 -184.0" fill="none" stroke="#d4cdce" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- cartel de la zona: texto "Zona 4" encima, dejar tranquilo este lugar -->
  <rect x="100" y="736.0" width="200" height="56" rx="28" fill="#1d2a44" fill-opacity="0.85"/>
  <text x="200" y="770.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff4d6">Zona 4 · niveles 19–24</text>
  <!-- niveles: círculo = botón del nivel (60 unidades); rectángulo punteado = su nombre -->
  <g>
    <g><circle cx="301.4" cy="648.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="301.4" y="654.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">19</text><rect x="245.4" y="682.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="251.1" cy="532.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="251.1" y="538.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">20</text><rect x="195.1" y="566.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="169.8" cy="416.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="169.8" y="422.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">21</text><rect x="113.8" y="450.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="106.8" cy="300.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="106.8" y="306.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">22</text><rect x="50.8" y="334.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="100.4" cy="184.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="100.4" y="190.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">23</text><rect x="44.4" y="218.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="154.4" cy="68.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="154.4" y="74.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">24</text><rect x="98.4" y="102.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
  </g>
  <text x="8" y="16" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ARRIBA (se une con la zona 5)</text>
  <text x="8" y="824" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ABAJO (se une con la zona 3)</text>
</svg>
