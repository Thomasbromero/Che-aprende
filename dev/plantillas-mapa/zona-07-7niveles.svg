<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2844" viewBox="0 0 400 948">
  <title>Plantilla zona 7: niveles 37 a 43 (400 x 948 unidades = 1200 x 2844 px)</title>
  <rect width="400" height="948" fill="#fff4d6"/>
  <!-- bordes: el de arriba se pega con la zona de arriba (zona 8) y el de abajo con la de abajo (zona 6) -->
  <rect width="400" height="948" fill="none" stroke="#1fb6b5" stroke-width="4"/>
  <!-- franjas de los costados: ahí va el detalle; el camino y los niveles se mueven en el centro -->
  <rect x="0" y="0" width="60" height="948" fill="#1fb6b5" fill-opacity="0.10"/>
  <rect x="340" y="0" width="60" height="948" fill="#1fb6b5" fill-opacity="0.10"/>
  <!-- camino (así lo dibuja la app) -->
  <path d="M228.4 1016.0 C214.9 974.0 169.0 825.3 147.3 764.0 C125.6 702.7 104.2 686.7 98.1 648.0 C92.0 609.3 97.5 570.7 110.8 532.0 C124.0 493.3 153.0 454.7 177.5 416.0 C202.0 377.3 237.0 338.7 257.9 300.0 C278.8 261.3 298.5 222.7 303.2 184.0 C307.8 145.3 300.3 129.3 285.9 68.0 C271.4 6.7 228.0 -142.0 216.5 -184.0" fill="none" stroke="#d4cdce" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- cartel de la zona: texto "Zona 7" encima, dejar tranquilo este lugar -->
  <rect x="100" y="852.0" width="200" height="56" rx="28" fill="#1d2a44" fill-opacity="0.85"/>
  <text x="200" y="886.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff4d6">Zona 7 · niveles 37–43</text>
  <!-- niveles: círculo = botón del nivel (60 unidades); rectángulo punteado = su nombre -->
  <g>
    <g><circle cx="147.3" cy="764.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="147.3" y="770.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">37</text><rect x="91.3" y="798.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="98.1" cy="648.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="98.1" y="654.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">38</text><rect x="42.1" y="682.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="110.8" cy="532.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="110.8" y="538.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">39</text><rect x="54.8" y="566.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="177.5" cy="416.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="177.5" y="422.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">40</text><rect x="121.5" y="450.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="257.9" cy="300.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="257.9" y="306.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">41</text><rect x="201.9" y="334.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="303.2" cy="184.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="303.2" y="190.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">42</text><rect x="247.2" y="218.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="285.9" cy="68.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="285.9" y="74.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">43</text><rect x="229.9" y="102.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
  </g>
  <text x="8" y="16" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ARRIBA (se une con la zona 8)</text>
  <text x="8" y="940" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ABAJO (se une con la zona 6)</text>
</svg>
