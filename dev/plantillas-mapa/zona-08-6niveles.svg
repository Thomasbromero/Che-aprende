<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2496" viewBox="0 0 400 832">
  <title>Plantilla zona 8: niveles 44 a 49 (400 x 832 unidades = 1200 x 2496 px)</title>
  <rect width="400" height="832" fill="#fff4d6"/>
  <!-- bordes: el de arriba se pega con la zona de arriba (zona 9) y el de abajo con la de abajo (zona 7) -->
  <rect width="400" height="832" fill="none" stroke="#1fb6b5" stroke-width="4"/>
  <!-- franjas de los costados: ahí va el detalle; el camino y los niveles se mueven en el centro -->
  <rect x="0" y="0" width="60" height="832" fill="#1fb6b5" fill-opacity="0.10"/>
  <rect x="340" y="0" width="60" height="832" fill="#1fb6b5" fill-opacity="0.10"/>
  <!-- camino (así lo dibuja la app) -->
  <path d="M285.9 900.0 C274.3 858.0 241.3 709.3 216.5 648.0 C191.7 586.7 157.2 570.7 137.1 532.0 C117.0 493.3 99.1 454.7 95.9 416.0 C92.7 377.3 102.2 338.7 117.8 300.0 C133.4 261.3 164.6 222.7 189.6 184.0 C214.6 145.3 248.5 129.3 267.7 68.0 C286.9 6.7 298.6 -142.0 304.7 -184.0" fill="none" stroke="#d4cdce" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- cartel de la zona: texto "Zona 8" encima, dejar tranquilo este lugar -->
  <rect x="100" y="736.0" width="200" height="56" rx="28" fill="#1d2a44" fill-opacity="0.85"/>
  <text x="200" y="770.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff4d6">Zona 8 · niveles 44–49</text>
  <!-- niveles: círculo = botón del nivel (60 unidades); rectángulo punteado = su nombre -->
  <g>
    <g><circle cx="216.5" cy="648.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="216.5" y="654.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">44</text><rect x="160.5" y="682.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="137.1" cy="532.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="137.1" y="538.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">45</text><rect x="81.1" y="566.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="95.9" cy="416.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="95.9" y="422.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">46</text><rect x="39.9" y="450.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="117.8" cy="300.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="117.8" y="306.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">47</text><rect x="61.8" y="334.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="189.6" cy="184.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="189.6" y="190.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">48</text><rect x="133.6" y="218.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="267.7" cy="68.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="267.7" y="74.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">49</text><rect x="211.7" y="102.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
  </g>
  <text x="8" y="16" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ARRIBA (se une con la zona 9)</text>
  <text x="8" y="824" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ABAJO (se une con la zona 7)</text>
</svg>
