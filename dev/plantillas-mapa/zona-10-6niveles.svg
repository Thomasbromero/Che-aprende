<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2496" viewBox="0 0 400 832">
  <title>Plantilla zona 10: niveles 56 a 61 (400 x 832 unidades = 1200 x 2496 px)</title>
  <rect width="400" height="832" fill="#fff4d6"/>
  <!-- bordes: el de arriba se pega con la zona de arriba (zona 11) y el de abajo con la de abajo (zona 9) -->
  <rect width="400" height="832" fill="none" stroke="#1fb6b5" stroke-width="4"/>
  <!-- franjas de los costados: ahí va el detalle; el camino y los niveles se mueven en el centro -->
  <rect x="0" y="0" width="60" height="832" fill="#1fb6b5" fill-opacity="0.10"/>
  <rect x="340" y="0" width="60" height="832" fill="#1fb6b5" fill-opacity="0.10"/>
  <!-- camino (así lo dibuja la app) -->
  <path d="M126.0 900.0 C138.6 858.0 176.8 709.3 201.9 648.0 C227.0 586.7 259.4 570.7 276.6 532.0 C293.8 493.3 306.1 454.7 304.9 416.0 C303.7 377.3 288.4 338.7 269.5 300.0 C250.7 261.3 217.1 222.7 192.0 184.0 C167.0 145.3 135.4 129.3 119.3 68.0 C103.3 6.7 99.5 -142.0 95.6 -184.0" fill="none" stroke="#d4cdce" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- cartel de la zona: texto "Zona 10" encima, dejar tranquilo este lugar -->
  <rect x="100" y="736.0" width="200" height="56" rx="28" fill="#1d2a44" fill-opacity="0.85"/>
  <text x="200" y="770.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff4d6">Zona 10 · niveles 56–61</text>
  <!-- niveles: círculo = botón del nivel (60 unidades); rectángulo punteado = su nombre -->
  <g>
    <g><circle cx="201.9" cy="648.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="201.9" y="654.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">56</text><rect x="145.9" y="682.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="276.6" cy="532.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="276.6" y="538.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">57</text><rect x="220.6" y="566.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="304.9" cy="416.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="304.9" y="422.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">58</text><rect x="248.9" y="450.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="269.5" cy="300.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="269.5" y="306.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">59</text><rect x="213.5" y="334.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="192.0" cy="184.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="192.0" y="190.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">60</text><rect x="136.0" y="218.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="119.3" cy="68.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="119.3" y="74.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">61</text><rect x="63.3" y="102.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
  </g>
  <text x="8" y="16" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ARRIBA (se une con la zona 11)</text>
  <text x="8" y="824" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ABAJO (se une con la zona 9)</text>
</svg>
