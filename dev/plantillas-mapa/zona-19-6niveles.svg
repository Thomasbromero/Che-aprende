<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2496" viewBox="0 0 400 832">
  <title>Plantilla zona 19: niveles 110 a 115 (400 x 832 unidades = 1200 x 2496 px)</title>
  <rect width="400" height="832" fill="#fff4d6"/>
  <!-- bordes: el de arriba se pega con la zona de arriba (zona 20) y el de abajo con la de abajo (zona 18) -->
  <rect width="400" height="832" fill="none" stroke="#1fb6b5" stroke-width="4"/>
  <!-- franjas de los costados: ahí va el detalle; el camino y los niveles se mueven en el centro -->
  <rect x="0" y="0" width="60" height="832" fill="#1fb6b5" fill-opacity="0.10"/>
  <rect x="340" y="0" width="60" height="832" fill="#1fb6b5" fill-opacity="0.10"/>
  <!-- camino (así lo dibuja la app) -->
  <path d="M95.0 900.0 C100.4 858.0 109.2 709.3 127.3 648.0 C145.4 586.7 178.6 570.7 203.7 532.0 C228.8 493.3 261.0 454.7 277.9 416.0 C294.7 377.3 306.4 338.7 304.8 300.0 C303.2 261.3 287.2 222.7 268.1 184.0 C249.0 145.3 215.2 129.3 190.2 68.0 C165.2 6.7 130.2 -142.0 118.2 -184.0" fill="none" stroke="#d4cdce" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- cartel de la zona: texto "Zona 19" encima, dejar tranquilo este lugar -->
  <rect x="100" y="736.0" width="200" height="56" rx="28" fill="#1d2a44" fill-opacity="0.85"/>
  <text x="200" y="770.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff4d6">Zona 19 · niveles 110–115</text>
  <!-- niveles: círculo = botón del nivel (60 unidades); rectángulo punteado = su nombre -->
  <g>
    <g><circle cx="127.3" cy="648.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="127.3" y="654.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">110</text><rect x="71.3" y="682.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="203.7" cy="532.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="203.7" y="538.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">111</text><rect x="147.7" y="566.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="277.9" cy="416.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="277.9" y="422.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">112</text><rect x="221.9" y="450.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="304.8" cy="300.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="304.8" y="306.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">113</text><rect x="248.8" y="334.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="268.1" cy="184.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="268.1" y="190.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">114</text><rect x="212.1" y="218.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="190.2" cy="68.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="190.2" y="74.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">115</text><rect x="134.2" y="102.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
  </g>
  <text x="8" y="16" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ARRIBA (se une con la zona 20)</text>
  <text x="8" y="824" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ABAJO (se une con la zona 18)</text>
</svg>
