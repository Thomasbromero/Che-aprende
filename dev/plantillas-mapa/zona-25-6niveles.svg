<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2496" viewBox="0 0 400 832">
  <title>Plantilla zona 25: niveles 147 a 152 (400 x 832 unidades = 1200 x 2496 px)</title>
  <rect width="400" height="832" fill="#fff4d6"/>
  <!-- bordes: el de arriba se pega con la zona de arriba (zona 26) y el de abajo con la de abajo (zona 24) -->
  <rect width="400" height="832" fill="none" stroke="#1fb6b5" stroke-width="4"/>
  <!-- franjas de los costados: ahí va el detalle; el camino y los niveles se mueven en el centro -->
  <rect x="0" y="0" width="60" height="832" fill="#1fb6b5" fill-opacity="0.10"/>
  <rect x="340" y="0" width="60" height="832" fill="#1fb6b5" fill-opacity="0.10"/>
  <!-- camino (así lo dibuja la app) -->
  <path d="M224.8 900.0 C211.4 858.0 165.4 709.3 144.1 648.0 C122.9 586.7 102.5 570.7 97.3 532.0 C92.1 493.3 98.8 454.7 112.8 416.0 C126.7 377.3 156.4 338.7 181.1 300.0 C205.8 261.3 240.5 222.7 261.0 184.0 C281.4 145.3 300.0 129.3 303.8 68.0 C307.6 6.7 287.0 -142.0 283.7 -184.0" fill="none" stroke="#d4cdce" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- cartel de la zona: texto "Zona 25" encima, dejar tranquilo este lugar -->
  <rect x="100" y="736.0" width="200" height="56" rx="28" fill="#1d2a44" fill-opacity="0.85"/>
  <text x="200" y="770.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff4d6">Zona 25 · niveles 147–152</text>
  <!-- niveles: círculo = botón del nivel (60 unidades); rectángulo punteado = su nombre -->
  <g>
    <g><circle cx="144.1" cy="648.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="144.1" y="654.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">147</text><rect x="88.1" y="682.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="97.3" cy="532.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="97.3" y="538.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">148</text><rect x="41.3" y="566.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="112.8" cy="416.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="112.8" y="422.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">149</text><rect x="56.8" y="450.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="181.1" cy="300.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="181.1" y="306.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">150</text><rect x="125.1" y="334.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="261.0" cy="184.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="261.0" y="190.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">151</text><rect x="205.0" y="218.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
    <g><circle cx="303.8" cy="68.0" r="30" fill="#1d2a44" fill-opacity="0.85"/><text x="303.8" y="74.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff4d6">152</text><rect x="247.8" y="102.0" width="112" height="36" rx="8" fill="#fff4d6" fill-opacity="0.45" stroke="#1d2a44" stroke-opacity="0.35" stroke-dasharray="4 3"/></g>
  </g>
  <text x="8" y="16" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ARRIBA (se une con la zona 26)</text>
  <text x="8" y="824" font-family="Arial, sans-serif" font-size="11" fill="#1d2a44">ABAJO (se une con la zona 24)</text>
</svg>
